<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Marca Viva</title>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/shop.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="ph-bold ph-cube"></i></div>
                Marca Viva
            </a>

            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="index.html#catalogo">Catálogo</a>
                <a href="#">Sobre</a>
                <a href="#">Contato</a>
            </nav>

            <div class="header-actions">
                <a href="login.html" class="btn btn-ghost" style="color: var(--accent-orange);">Entrar</a>
                <a href="#" class="btn btn-primary">Solicitar Orçamento</a>
            </div>
        </div>
    </header>

    <!-- Auth Section -->
    <div class="auth-page-bg">
        <div class="auth-card">
            <div class="auth-header">
                <h2 id="form-title">Boas-vindas</h2>
                <p id="form-subtitle">Entre com seus dados para acessar sua conta</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="tab-btn active" id="btn-login" onclick="toggleAuthMode('login')">Entrar</div>
                <div class="tab-btn" id="btn-register" onclick="toggleAuthMode('register')">Cadastrar</div>
            </div>

            <!-- Login View -->
            <div id="login-view">
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="input-wrapper">
                            <i class="ph-regular ph-envelope input-icon"></i>
                            <input type="email" id="login-email" class="form-input" placeholder="seu@email.com"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <div class="input-wrapper">
                            <i class="ph-regular ph-lock input-icon"></i>
                            <input type="password" id="login-password" class="form-input" placeholder="••••••••"
                                required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                    </div>

                    <button type="button" class="btn btn-full" onclick="handleLogin()">Entrar na Plataforma</button>
                </form>
            </div>

            <!-- Register View -->
            <div id="register-view" class="hidden">
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="ph-regular ph-user input-icon"></i>
                            <input type="text" name="name" class="form-input" placeholder="Seu nome" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="input-wrapper">
                            <i class="ph-regular ph-envelope input-icon"></i>
                            <input type="email" name="email" class="form-input" placeholder="seu@email.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <div class="input-wrapper">
                            <i class="ph-regular ph-lock input-icon"></i>
                            <input type="password" name="password" class="form-input" placeholder="Crie uma senha"
                                required>
                        </div>
                    </div>

                    <button type="button" class="btn btn-full" onclick="handleRegister()">Criar Conta Gratuita</button>
                </form>
            </div>

        </div>
    </div>

    <!-- Simple Footer -->
    <footer
        style="background: white; border-top: 1px solid #f1f5f9; padding: 25px 0; text-align: center; color: #94a3b8; font-size: 0.85rem;">
        <div class="container">
            © 2026 Marca Viva. Todos os direitos reservados.
        </div>
    </footer>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/services/supabase-client.js"></script>
    <script src="scripts/auth.js"></script>
    <script>
        // Override Toggle for UI Tab state
        // Override Toggle for UI Tab state
        const originalToggle = window.toggleAuthMode;
        window.toggleAuthMode = (mode) => {
            // Update tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            // UI text tweaks
            if (mode === 'login') {
                document.getElementById('form-title').innerText = 'Boas-vindas';
                document.getElementById('form-subtitle').innerText = 'Entre com seus dados para acessar conta';
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('register-view').classList.add('hidden');
            } else {
                document.getElementById('form-title').innerText = 'Criar Conta';
                document.getElementById('form-subtitle').innerText = 'Preencha os dados e comece agora';
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('register-view').classList.remove('hidden');
            }

            // Call original logic if it existed (it might not, so safe check)
            if (originalToggle) originalToggle(mode);
        }

        // Global Handle Login
        window.handleLogin = async () => {
            console.log("Login button clicked");
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.querySelector('#login-view button');

            if (!email || !password) {
                alert("Por favor, preencha email e senha.");
                return;
            }

            const originalText = btn.innerText;
            btn.innerText = 'Entrando...';
            btn.disabled = true;

            try {
                if (typeof authService === 'undefined') {
                    throw new Error("Serviço de autenticação não carregado.");
                }
                const success = await authService.login(email, password);
                if (!success) {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Erro ao tentar login: ' + err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };

        // Global Handle Register
        window.handleRegister = async () => {
            console.log("Register button clicked");
            const form = document.getElementById('registerForm');
            // Check form existence
            if (!form) return;

            const nameInput = form.querySelector('input[name="name"]');
            const emailInput = form.querySelector('input[name="email"]');
            const passInput = form.querySelector('input[name="password"]');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passInput.value;

            if (!name || !email || !password) {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            if (password.length < 6) {
                alert('A senha deve ter pelo menos 6 caracteres.');
                return;
            }

            const btn = form.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Cadastrando...';
            btn.disabled = true;

            // Default values
            const type = 'pf';
            const doc = '';

            try {
                if (typeof authService === 'undefined') {
                    throw new Error("Serviço de autenticação não carregado.");
                }

                console.log("Starting manual registration for:", email);
                const success = await authService.register(name, email, password, type, doc);

                if (!success) {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error('Registration Error:', err);
                alert('Erro inesperado: ' + err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>

</html>
