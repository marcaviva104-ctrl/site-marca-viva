<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Reset Admin | Marca Viva</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0f172a;
            margin: 0;
        }

        .box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-bottom: 8px;
            color: #1e293b;
        }

        p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .email-box {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.95rem;
            color: #1e293b;
            margin-bottom: 24px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #f97316;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ea580c;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .msg.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .msg.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        .divider {
            margin: 24px 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }

        .new-pass {
            display: none;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #f97316;
        }

        .warning {
            font-size: 0.75rem;
            color: #ef4444;
            margin-top: 16px;
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>🔐 Reset de Admin</h2>
        <p>Enviar link de recuperação de senha para:</p>
        <div class="email-box">leivinjesus57@gmail.com</div>

        <button id="btn-reset" onclick="sendReset()">📨 Enviar Email de Recuperação</button>
        <div class="msg" id="msg"></div>

        <hr class="divider">

        <p style="font-size:0.85rem; color:#64748b; margin-bottom:12px;">Ou defina uma nova senha diretamente (requer o
            link do email recebido):</p>
        <div class="new-pass" id="new-pass-area">
            <input type="password" id="new-pass" placeholder="Nova senha (mín. 6 caracteres)">
            <button onclick="updatePass()" style="background:#10b981;">✅ Salvar Nova Senha</button>
            <div class="msg" id="msg2"></div>
        </div>

        <p class="warning">⚠️ Apague esta página após usar. Não compartilhe o link.</p>
    </div>

    <script>
        // Pegar URL e chave do projeto
        const SUPABASE_URL = 'https://qnudbyhnqtsxlqwgkmal.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFudWRieWhucXRzeGxxd2drbWFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3MTM2NjMsImV4cCI6MjA4MzI4OTY2M30.eedi0r5O0XWXV8UhoELO7HfauxX01d3JbZBh82JgCIQ';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function sendReset() {
            const btn = document.getElementById('btn-reset');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            const { error } = await sb.auth.resetPasswordForEmail('leivinjesus57@gmail.com', {
                redirectTo: window.location.origin + '/scripts/utils/reset-cache.html'
            });

            if (error) {
                msg.className = 'msg error';
                msg.textContent = '❌ Erro: ' + error.message;
            } else {
                msg.className = 'msg success';
                msg.innerHTML = '✅ Email enviado! Verifique <strong>leivinjesus57@gmail.com</strong>.<br><br>Depois de clicar no link, você pode usar o campo abaixo para definir a senha.';
                document.getElementById('new-pass-area').style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = '📨 Enviar Email de Recuperação';
        }

        // Se tiver token na URL (vindo do link de reset do email), habilita troca direta
        const hash = window.location.hash;
        if (hash.includes('access_token') || hash.includes('type=recovery')) {
            document.getElementById('new-pass-area').style.display = 'block';
        }

        async function updatePass() {
            const pass = document.getElementById('new-pass').value;
            const msg2 = document.getElementById('msg2');
            if (pass.length < 6) {
                msg2.className = 'msg error';
                msg2.textContent = '⚠️ A senha precisa ter no mínimo 6 caracteres.';
                return;
            }
            const { error } = await sb.auth.updateUser({ password: pass });
            if (error) {
                msg2.className = 'msg error';
                msg2.textContent = '❌ ' + error.message + ' — Clique primeiro no link do email!';
            } else {
                msg2.className = 'msg success';
                msg2.innerHTML = '✅ Senha alterada com sucesso! <a href="../admin.html">Ir para o Admin →</a>';
            }
        }
    </script>
</body>

</html>
