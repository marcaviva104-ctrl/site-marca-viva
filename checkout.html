<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido | Marca Viva</title>

    <!-- Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="styles/landing.css">
    <link rel="stylesheet" href="styles/checkout.css">

    <!-- Coupon Service -->
    <script src="scripts/coupon-service.js"></script>

    <!-- Scripts (Services) - Moved to bottom for performance and prevent blocking -->
    <!-- Mercado Pago SDK -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="scripts/config.js"></script>
    <script src="scripts/services/supabase-client.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/cart.js?v=4"></script>
    <script src="scripts/shipping-service.js?v=4"></script>
    <script src="scripts/checkout-service.js?v=4"></script>

    <!-- Main Checkout Script -->
    <script src="scripts/checkout.js?v=4"></script>

    <script>
        // Coupon Application Logic
        async function applyCoupon() {
            const input = document.getElementById('coupon-input');
            const btn = document.getElementById('apply-coupon-btn');

            // ... (rest of coupon logic matches existing) ...
            const code = input.value.trim().toUpperCase();

            if (!code) {
                showCouponMessage('Digite um código de cupom', 'error');
                return;
            }

            // Loading
            btn.disabled = true;
            btn.textContent = '...';

            // Get cart total
            const cartTotal = cartService.getTotal();

            // Validate coupon
            const result = await CouponService.validate(code, cartTotal);

            if (result.valid) {
                showCouponMessage(result.message, 'success');
                document.getElementById('coupon-code-display').textContent = code;
                document.getElementById('coupon-desc-display').textContent = result.coupon.description;
                document.getElementById('coupon-applied').style.display = 'block';
                input.value = '';
                input.disabled = true;
                updateCheckoutTotals();
            } else {
                showCouponMessage(result.message, 'error');
            }

            btn.disabled = false;
            btn.textContent = 'Aplicar';
        }

        function removeCoupon() {
            CouponService.clear();
            document.getElementById('coupon-applied').style.display = 'none';
            document.getElementById('coupon-input').disabled = false;
            document.getElementById('coupon-input').value = '';
            updateCheckoutTotals();
        }

        function showCouponMessage(msg, type) {
            const message = document.getElementById('coupon-message');
            message.textContent = msg;
            message.style.display = 'block';
            message.style.color = type === 'success' ? '#10b981' : '#ef4444';
            message.style.fontWeight = '600';
            setTimeout(() => { if (type === 'success') message.style.display = 'none'; }, 3000);
        }

        function updateCheckoutTotals() {
            const coupon = CouponService.getCurrent();
            const discountRow = document.getElementById('discount-row');
            const discountValue = document.getElementById('summary-discount');

            if (coupon && coupon.discount_amount > 0) {
                discountRow.style.display = 'flex';
                discountValue.textContent = '- R$ ' + coupon.discount_amount.toFixed(2);
            } else {
                discountRow.style.display = 'none';
            }

            if (typeof checkout !== 'undefined' && checkout.updateSummary) {
                checkout.updateSummary();
            }
        }

        // --- FALLBACK SAFETY SCRIPT ---
        // Se o checkout.js falhar em carregar após 3 segundos, mostramos um erro manual.
        setTimeout(() => {
            const orderItems = document.getElementById('order-items');
            // Verifica se ainda tem o texto original "Carregando..."
            if (orderItems && orderItems.innerText.includes('Carregando')) {
                console.error("Safety Monitor: Checkout seems stuck!");

                // Tenta forçar a renderização se o objeto existir
                if (typeof checkout !== 'undefined' && checkout.renderCart) {
                    console.warn("Safety Monitor: Forcing renderCart()...");
                    checkout.renderCart();
                } else if (typeof cartService !== 'undefined') {
                    // Fallback extremo
                    console.warn("Safety Monitor: Force rendering via CartService...");
                    const cart = cartService.getCart();
                    if (cart.length === 0) {
                        orderItems.innerHTML = '<div style="padding:20px;text-align:center">Carrinho Vazio (Fallback)</div>';
                    } else {
                        orderItems.innerHTML = '<div style="padding:20px;text-align:center;color:orange">Carregamento parcial. Tente recarregar.</div>';
                    }
                } else {
                    orderItems.innerHTML = `
                        <div style="text-align:center; padding:20px; color:#ef4444;">
                            <i class="ph-bold ph-wifi-slash" style="font-size:2rem;margin-bottom:10px;"></i><br>
                            <strong>Falha no Carregamento</strong><br>
                            Verifique sua conexão ou recarregue a página.
                        </div>
                    `;
                }
            }
        }, 3000); // 3 seconds timeout
    </script>
    </body>

</html>
