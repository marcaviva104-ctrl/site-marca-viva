<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marca Viva | Gestão de Produção</title>

    <!-- Design System Global -->
    <link rel="stylesheet" href="../styles/base/reset.css">

    <!-- Kanban Premium Styles -->
    <link rel="stylesheet" href="../styles/pages/kanban.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Drag & Drop Library -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body>

    <!-- Header Flutuante -->
    <header class="kanban-header">
        <div class="brand-area" style="display:flex; align-items:center; gap:10px;">
            <button onclick="window.location.href='../admin.html'"
                style="background:transparent; border:none; color:white; cursor:pointer;" title="Voltar ao Painel">
                <i class="ph-bold ph-arrow-left" style="font-size:1.5rem;"></i>
            </button>
            <h1>Gestão de Produção</h1>
        </div>

        <div class="view-switch">
            <button class="view-btn active" id="view-production" onclick="kanban.switchView('production')">
                <i class="ph-bold ph-kanban"></i> Produção
            </button>
            <button class="view-btn" id="view-inbox" onclick="kanban.switchView('inbox')">
                <i class="ph-bold ph-tray"></i> Novos Pedidos
                <span class="badge" id="inbox-count"
                    style="display:none; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:10px;">0</span>
            </button>
        </div>

        <div class="filter-bar">
            <!-- Search -->
            <div class="search-wrapper" style="position:relative;">
                <i class="ph-bold ph-magnifying-glass"
                    style="position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#94a3b8;"></i>
                <input type="text" id="kanban-search" placeholder="Buscar cliente..."
                    style="padding:8px 8px 8px 32px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; outline:none; width:200px;">
            </div>

            <!-- Botão Mágico para criar teste -->
            <button class="btn-primary" onclick="alert('Funcionalidade em desenvolvimento!')">
                <i class="ph ph-plus"></i> Novo
            </button>
        </div>
    </header>

    <!-- O Quadro Infinito -->
    <main class="kanban-board" id="board">
        <!-- O JS vai preencher as colunas aqui -->
        <div style="color:white; padding: 20px;">Carregando sistema...</div>
    </main>

    <!-- Details Modal -->
    <div id="protocol-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Detalhes do Pedido <span id="modal-protocol-id">#REQ-0000</span></h2>
                <button class="close-modal" onclick="closeProtocolModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="client-info-section">
                    <h3 class="section-title"><i class="ph-bold ph-user"></i> Cliente</h3>
                    <div class="info-grid">
                        <div class="info-item">
                            <label>Nome</label>
                            <span id="modal-client-name">Carregando...</span>
                        </div>
                        <div class="info-item">
                            <label>Email</label>
                            <span id="modal-client-email">Carregando...</span>
                        </div>
                        <div class="info-item">
                            <label>WhatsApp</label>
                            <button id="modal-whatsapp-btn" class="btn-whatsapp-sm">
                                <i class="ph-logo ph-whatsapp"></i> Chamar
                            </button>
                        </div>
                    </div>
                </div>

                <div class="order-items-section">
                    <h3 class="section-title"><i class="ph-bold ph-package"></i> Itens do Pedido</h3>
                    <div id="modal-items-list" class="items-list">
                        <!-- JS injected items -->
                        <div class="item-row">
                            <span>Carregando itens...</span>
                        </div>
                    </div>
                    <div class="order-total-row">
                        <span>Total Previsto:</span>
                        <span id="modal-total-value">R$ 0,00</span>
                    </div>
                </div>

                <div class="actions-section">
                    <h3 class="section-title"><i class="ph-bold ph-gear"></i> Ações</h3>
                    <div class="actions-grid">
                        <button class="btn-action" onclick="alert('Em breve: Aprovar direto daqui!')">
                            <i class="ph-bold ph-check-circle"></i> Aprovar Pedido
                        </button>
                        <button class="btn-action danger" onclick="alert('Em breve: Recusar direto daqui!')">
                            <i class="ph-bold ph-x-circle"></i> Recusar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Configs e Scripts (Auth) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../scripts/config/config.js"></script>
    <script src="../scripts/services/supabase-client.js"></script>
    <script src="../scripts/services/auth.js"></script>
    <script src="../scripts/services/KanbanService.js"></script>

    <!-- Kanban Logic -->
    <script src="../scripts/pages/kanban.js"></script>
</body>

</html>
