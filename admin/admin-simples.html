<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Simples - Marca Viva</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: #ea580c;
            color: white;
        }

        .btn-primary:hover {
            background: #c2410c;
        }

        .products-list {
            margin-top: 30px;
        }

        .product-item {
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            color: #333;
        }

        .product-price {
            color: #10b981;
            font-weight: 700;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Painel Admin Simplificado</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-products">-</div>
                <div class="stat-label">Total de Produtos</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <div class="stat-value" id="total-revenue">R$ 0</div>
                <div class="stat-label">Valor Total Estoque</div>
            </div>
        </div>

        <button class="btn btn-primary" onclick="openAddProductModal()">➕ Adicionar Produto</button>

        <div class="products-list" id="products-list">
            <div class="loading">Carregando produtos...</div>
        </div>
    </div>

    <!-- Modal Adicionar Produto -->
    <div class="modal" id="add-product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Novo Produto</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label>Nome do Produto *</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label>Categoria *</label>
                    <select id="product-category" required>
                        <option value="">Selecione...</option>
                        <option value="Vestuário">Vestuário</option>
                        <option value="Canetas">Canetas</option>
                        <option value="Cadernos">Cadernos</option>
                        <option value="Bolsas">Bolsas</option>
                        <option value="Copos e Garrafas">Copos e Garrafas</option>
                        <option value="Eletrônicos">Eletrônicos</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Preço (R$) *</label>
                    <input type="number" id="product-price" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Estoque *</label>
                    <input type="number" id="product-stock" min="0" required>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea id="product-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>URL da Imagem</label>
                    <input type="url" id="product-image" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Salvar Produto</button>
            </form>
        </div>
    </div>

    <script>
        // Configuração Supabase
        const SUPABASE_URL = 'https://qnudbyhnqtsxlqwgkmal.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AMo1o9yvNV-p_qSE2j5Ztw_7CM1oYeL';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];

        // Carregar produtos
        async function loadProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                products = data || [];
                renderProducts();
                updateStats();
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                Swal.fire('Erro', 'Não foi possível carregar os produtos', 'error');
            }
        }

        // Renderizar produtos
        function renderProducts() {
            const container = document.getElementById('products-list');

            if (products.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum produto cadastrado</div>';
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="product-item">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div style="color: #666; font-size: 14px; margin-top: 4px;">
                            ${p.category} • Estoque: ${p.stock} unidades
                        </div>
                    </div>
                    <div class="product-price">R$ ${parseFloat(p.price).toFixed(2)}</div>
                    <button class="btn" style="background: #ef4444; color: white; margin-left: 10px;" onclick="deleteProduct('${p.id}')">🗑️</button>
                </div>
            `).join('');
        }

        // Atualizar estatísticas
        function updateStats() {
            document.getElementById('total-products').textContent = products.length;
            const totalValue = products.reduce((sum, p) => sum + (parseFloat(p.price) * parseInt(p.stock || 0)), 0);
            document.getElementById('total-revenue').textContent = `R$ ${totalValue.toFixed(2)}`;
        }

        // Modal
        function openAddProductModal() {
            document.getElementById('add-product-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('add-product-modal').classList.remove('active');
            document.getElementById('product-form').reset();
        }

        // Salvar produto
        async function saveProduct(event) {
            event.preventDefault();

            const productData = {
                id: 'PROD-' + Date.now(),
                name: document.getElementById('product-name').value,
                category: document.getElementById('product-category').value,
                price: parseFloat(document.getElementById('product-price').value),
                stock: parseInt(document.getElementById('product-stock').value),
                description: document.getElementById('product-description').value,
                image: document.getElementById('product-image').value || 'https://via.placeholder.com/600',
                status: 'active',
                cost: 0,
                min_qty: 1,
                weight: 0.5,
                height: 10,
                width: 20,
                length: 30,
                recipe: []
            };

            try {
                const { error } = await supabase
                    .from('products')
                    .insert(productData);

                if (error) throw error;

                Swal.fire('Sucesso!', 'Produto adicionado com sucesso', 'success');
                closeModal();
                loadProducts();
            } catch (error) {
                console.error('Erro ao salvar:', error);
                Swal.fire('Erro', 'Não foi possível salvar o produto', 'error');
            }
        }

        // Deletar produto
        async function deleteProduct(id) {
            const result = await Swal.fire({
                title: 'Tem certeza?',
                text: 'Esta ação não pode ser desfeita!',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Sim, deletar!',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                try {
                    const { error } = await supabase
                        .from('products')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;

                    Swal.fire('Deletado!', 'Produto removido com sucesso', 'success');
                    loadProducts();
                } catch (error) {
                    console.error('Erro ao deletar:', error);
                    Swal.fire('Erro', 'Não foi possível deletar o produto', 'error');
                }
            }
        }

        // Inicializar
        loadProducts();
    </script>
</body>

</html>
