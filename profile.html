<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | Marca Viva</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/shop.css">
    <link rel="stylesheet" href="styles/auth.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .back-link:hover {
            color: var(--primary-hero);
        }
    </style>
</head>

<body>

    <!-- Header (Simplified) -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="ph-bold ph-cube"></i></div>
                Marca Viva
            </a>
            <div id="user-nav"></div> <!-- Reused UI Auth -->
        </div>
    </header>

    <div class="container profile-container">
        <a href="index.html" class="back-link"><i class="ph-bold ph-arrow-left"></i> Voltar para Loja</a>

        <div class="profile-card">
            <div class="auth-header"
                style="text-align: left; margin-bottom: 30px; border-bottom: 1px solid #f1f5f9; padding-bottom: 20px;">
                <h2>Meu Perfil</h2>
                <p>Gerencie suas informações pessoais e de entrega.</p>
            </div>

            <form id="profileForm">
                <!-- Data Pessoal -->
                <div class="section-title">
                    <i class="ph-duotone ph-user"></i> Dados Pessoais
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <div class="input-wrapper">
                            <i class="ph-bold ph-user input-icon"></i>
                            <input type="text" id="name" class="form-input" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="input-wrapper">
                            <i class="ph-bold ph-envelope input-icon"></i>
                            <input type="email" id="email" class="form-input" readonly
                                style="background: #f8fafc; cursor: not-allowed;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">CPF / CNPJ</label>
                        <div class="input-wrapper">
                            <i class="ph-bold ph-identification-card input-icon"></i>
                            <input type="text" id="doc" class="form-input" placeholder="000.000.000-00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Telefone / WhatsApp</label>
                        <div class="input-wrapper">
                            <i class="ph-bold ph-whatsapp-logo input-icon"></i>
                            <input type="text" id="phone" class="form-input" placeholder="(00) 00000-0000">
                        </div>
                    </div>
                </div>

                <hr style="margin: 30px 0; border: 0; border-top: 1px solid #f1f5f9;">

                <!-- Endereço -->
                <div class="section-title">
                    <i class="ph-duotone ph-map-pin"></i> Endereço de Entrega
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">CEP</label>
                        <div class="input-wrapper">
                            <i class="ph-bold ph-map-trifold input-icon"></i>
                            <input type="text" id="zip" class="form-input" placeholder="00000-000">
                        </div>
                    </div>
                    <div class="form-group">
                        <!-- Spacer -->
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Rua / Logradouro</label>
                        <input type="text" id="street" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bairro</label>
                        <input type="text" id="neighborhood" class="form-input">
                    </div>
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr 2fr;">
                    <div class="form-group">
                        <label class="form-label">Número</label>
                        <input type="text" id="number" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Complemento</label>
                        <input type="text" id="complement" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cidade - UF</label>
                        <input type="text" id="city" class="form-input">
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 30px;">
                    <button type="button" class="btn btn-full" onclick="saveProfile()" style="max-width: 200px;">
                        <i class="ph-bold ph-floppy-disk" style="margin-right: 8px;"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/config.js"></script>
    <script src="scripts/services/supabase-client.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/ui-auth.js"></script>
    <script src="scripts/profile.js"></script>
</body>

</html>
