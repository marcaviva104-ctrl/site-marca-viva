<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | Marca Viva</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Design System CSS -->
    <link rel="stylesheet" href="styles/base/global.css">
    <link rel="stylesheet" href="styles/base/design-system.css">
    <link rel="stylesheet" href="styles/components/premium-components.css">
    <link rel="stylesheet" href="styles/pages/profile-bento.css">
    <style>
        /* Keep any necessary overrides here */
    </style>
</head>

<body>

    <!-- Header - Padronizado (Igual à Homepage) -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="ph-bold ph-cube"></i></div>
                Marca Viva
            </a>

            <!-- Navigation Links -->
            <nav class="nav-links" id="main-nav-links">
                <a href=" index.html">Início</a>
                <a href="index.html#catalogo">Catálogo</a>
                <a href="profile.html" class="active">Meu Perfil</a>
                <a href="#">Contato</a>
            </nav>

            <div class="header-actions" id="user-nav">
                <!-- Favorites Button -->
                <a href="favoritos.html" class="btn btn-ghost" id="favorites-btn"
                    style="position: relative; margin-right: 10px; display: flex; align-items: center; gap: 8px;">
                    <i class="ph-bold ph-heart" style="font-size: 1.3rem;"></i>
                    <span id="favorites-counter" class="favorites-counter" style="display: none;">0</span>
                </a>

                <!-- Cart Trigger -->
                <button onclick="cartService.toggle()" class="btn btn-ghost" id="static-cart-btn"
                    style="position: relative; margin-right: 10px; display: none;">
                    <i class="ph-bold ph-shopping-cart" style="font-size: 1.3rem;"></i>
                    <span class="cart-count-badge"
                        style="position: absolute; top: 0; right: 0; background: var(--accent-orange); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.65rem; display: none; align-items: center; justify-content: center;">0</span>
                </button>

                <button onclick="if(window.authService) window.authService.logout()" class="btn btn-ghost"
                    style="padding: 8px; color: #64748b; font-weight: 600;" title="Sair">
                    <i class="ph-bold ph-sign-out"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <div class="bento-container">
        <!-- 1. Hero Area -->
        <div class="bento-card area-hero">
            <div class="hero-content">
                <div class="hero-avatar" id="hero-avatar">MVP</div>
                <div class="hero-info">
                    <h1 id="hero-name">Carregando...</h1>
                    <p id="hero-email">usuario@email.com</p>
                    <span class="vip-badge" id="hero-badge">Cliente Novo</span>
                </div>
            </div>

            <div class="loyalty-progress">
                <div class="progress-label">
                    <span>Próximo Nível: <strong>VIP</strong></span>
                    <span id="loyalty-txt">Faltam R$ 500,00</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="loyalty-bar" style="width: 20%;"></div>
                </div>
            </div>
        </div>

        <!-- 2. Actions Area -->
        <div class="bento-card area-actions">
            <a href="https://wa.me/553187398136" target="_blank" class="btn-action">
                <i class="ph-bold ph-whatsapp-logo" style="color: #25D366;"></i>
                Falar no Zap
            </a>
            <button onclick="openAddressModal()" class="btn-action">
                <i class="ph-bold ph-map-pin" style="color: #3b82f6;"></i>
                Endereço
            </button>
            <button onclick="openEditProfileModal()" class="btn-action">
                <i class="ph-bold ph-user-gear" style="color: #64748b;"></i>
                Dados
            </button>
            <button onclick="openPasswordModal()" class="btn-action">
                <i class="ph-bold ph-lock-key" style="color: #f59e0b;"></i>
                Alterar Senha
            </button>
        </div>

        <!-- 3. Stats/Quick Info (Optional place holder for now) -->
        <div class="bento-card area-stats"
            style="background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <div
                style="width: 50px; height: 50px; background: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
                <i class="ph-duotone ph-shopping-bag" style="color: #3b82f6; font-size: 1.5rem;"></i>
            </div>
            <h3 id="stat-orders-count" style="font-size: 1.5rem; color: #1e293b; margin: 0;">0</h3>
            <span style="color: #64748b; font-size: 0.85rem;">Pedidos Totais</span>
        </div>

        <!-- 4. Orders Area -->
        <div class="bento-card area-orders">
            <div class="orders-header">
                <h2><i class="ph-duotone ph-receipt"></i> Meus Pedidos</h2>
                <button class="btn-sm"
                    style="background: #f1f5f9; color: #475569; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer;">Ver
                    Todos</button>
            </div>

            <div class="orders-list" id="orders-list-container">
                <!-- Dynamic Content Loads Here -->
                <div style="text-align: center; padding: 40px; color: #94a3b8;">
                    <i class="ph-duotone ph-spinner-gap ph-spin" style="font-size: 2rem;"></i>
                    <p style="margin-top: 10px;">Carregando pedidos...</p>
                </div>
            </div>
        </div>

        <!-- 5. Address Preview (Mini) -->
        <div class="bento-card area-address">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h3 style="font-size: 1rem; color: #334155;">Entrega em:</h3>
                <i class="ph-bold ph-truck" style="color: #10b981;"></i>
            </div>
            <p id="mini-address" style="color: #475569; font-size: 0.9rem; line-height: 1.5;">
                Carregando endereço...
            </p>
        </div>
    </div>

    <!-- Modals for Editing (Old form lives here now) -->
    <div id="edit-profile-modal" style="display: none;">
        <!-- Inject old form here dynamically or redirect? Let's use SweetAlert for simple edits later or keep a hidden div -->
    </div>

    <!-- Scripts -->
    <script src="scripts/config/config.js"></script>
    <script src="scripts/services/supabase-client.js"></script>
    <script src="scripts/services/auth.js"></script>
    <script src="scripts/components/ui-auth.js"></script>
    <script src="scripts/pages/profile.js"></script>
</body>

</html>
