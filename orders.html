<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos | Marca Viva</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles/base/global.css">
    <link rel="stylesheet" href="styles/pages/shop.css">
    <style>
        /* Standard Light Theme Layout */
        body {
            background-color: #f8fafc;
            /* Very light gray background */
        }

        /* Orders Container */
        .orders-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px 20px;
        }

        .page-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary-hero);
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
        }

        /* Order Card - Light Theme */
        .order-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            /* Soft shadow */
            transition: 0.3s;
        }

        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #cbd5e1;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .order-id {
            font-weight: 700;
            color: var(--primary-hero);
            font-size: 1.1rem;
            letter-spacing: 0.02em;
        }

        .order-date {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* Progress Bar - Premium Animated Theme */
        .progress-track {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 40px 0;
            padding: 0 10px;
        }

        /* The background gray line */
        .progress-line-bg {
            position: absolute;
            top: 20px;
            left: 30px;
            right: 30px;
            height: 4px;
            background: #e2e8f0;
            z-index: 0;
            border-radius: 99px;
        }

        /* The colored fill line that animates */
        .progress-line-fill {
            position: absolute;
            top: 20px;
            left: 30px;
            height: 4px;
            background: var(--accent-orange);
            z-index: 0;
            border-radius: 99px;
            width: 0%;
            /* JS will set this */
            transition: width 1s ease-in-out;
        }

        .progress-step {
            position: relative;
            z-index: 1;
            text-align: center;
            flex: 1;
            cursor: default;
        }

        .step-circle {
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.1rem;
            color: #94a3b8;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .step-info {
            opacity: 0.7;
            transition: 0.3s;
        }

        .step-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .step-desc {
            font-size: 0.7rem;
            color: #94a3b8;
            max-width: 120px;
            margin: 0 auto;
            line-height: 1.2;
        }

        /* Active State (Current) */
        .progress-step.active .step-circle {
            background: var(--accent-orange);
            border-color: var(--accent-orange);
            color: white;
            transform: scale(1.15);
            box-shadow: 0 0 0 6px rgba(234, 88, 12, 0.15);
            animation: pulse-ring 2s infinite;
        }

        .progress-step.active .step-info {
            opacity: 1;
        }

        .progress-step.active .step-label {
            color: var(--accent-orange);
        }

        /* Completed State */
        .progress-step.completed .step-circle {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .progress-step.completed .step-label {
            color: #10b981;
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.4);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(234, 88, 12, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(234, 88, 12, 0);
            }
        }

        /* Items List - Light Theme */
        .order-items {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #f1f5f9;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .order-item-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            background: white;
            border-radius: 16px;
            border: 1px dashed #cbd5e1;
        }

        .btn-order-action {
            background: white;
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-order-action:hover {
            background: var(--accent-orange);
            color: white;
        }
    </style>
</head>

<body>

    <!-- Header (Standardized) -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="ph-bold ph-cube"></i></div>
                Marca Viva
            </a>

            <nav class="nav-links" id="main-nav-links">
                <a href="index.html">Início</a>
                <a href="index.html#catalogo">Catálogo</a>
                <!-- Meus Pedidos injected via JS -->
                <a href="#">Contato</a>
            </nav>

            <div class="header-actions" id="user-nav">
                <!-- Cart Trigger (Visible to all) -->
                <button onclick="cartService.toggle()" class="btn btn-ghost"
                    style="position: relative; margin-right: 10px;">
                    <i class="ph-bold ph-shopping-cart" style="font-size: 1.3rem;"></i>
                    <span class="cart-count-badge"
                        style="position: absolute; top: 0; right: 0; background: var(--accent-orange); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.65rem; display: none; align-items: center; justify-content: center;">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Page Content -->
    <div class="container orders-container">
        <div class="page-header">
            <h1>Meus Pedidos</h1>
            <p>Acompanhe o status e histórico de suas solicitações.</p>
        </div>

        <div id="orders-list">
            <!-- Loading... -->
            <div style="text-align:center; color: #64748b; margin-top: 40px;">
                <i class="ph-duotone ph-spinner-gap ph-spin" style="font-size: 2rem;"></i>
                <div style="margin-top: 10px;">Carregando pedidos...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts/config/config.js"></script>
    <script src="scripts/services/supabase-client.js"></script>
    <script src="scripts/services/auth.js"></script>
    <script src="scripts/services/products.js"></script>
    <script src="scripts/components/cart.js"></script>
    <script src="scripts/components/ui-auth.js?v=2.2"></script> <!-- Added Standard Auth UI -->
    <script src="scripts/pages/orders.js"></script>
    <script src="scripts/components/chat.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Header logic is now handled by ui-auth.js

            // Just load orders
            loadMyOrders();
        });

        async function loadMyOrders() {
            // Check auth via service
            const user = authService.getCurrentUser();

            if (!user) {
                document.getElementById('orders-list').innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-lock-key" style="font-size: 3rem; margin-bottom: 20px; color: var(--accent-orange);"></i>
                        <h3 style="color: #1e293b; margin-bottom: 10px;">Acesso Restrito</h3>
                        <p style="margin-bottom: 20px;">Faça login para acompanhar seus pedidos.</p>
                        <a href="login.html" class="btn btn-primary" style="display:inline-block; padding: 12px 30px; text-decoration:none; background: var(--accent-orange); color: white; border-radius: 8px;">Fazer Login</a>
                    </div>
                `;
                return;
            }

            // Fetch orders from Supabase
            const orders = await OrderManager.getOrdersByCustomer(user.email);
            const container = document.getElementById('orders-list');

            // Handle Network/Auth Errors (Future Proofing)
            if (orders.error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-warning-circle" style="font-size: 3rem; margin-bottom: 20px; color: #ef4444;"></i>
                        <h3 style="color: #1e293b; margin-bottom: 10px;">Erro ao carregar pedidos</h3>
                        <p style="margin-bottom: 20px;">Houve um problema de conexão. Tente novamente.</p>
                        <button onclick="loadMyOrders()" class="btn btn-primary" style="display:inline-block; padding: 12px 30px; text-decoration:none; background: #64748b; color: white; border-radius: 8px; border:none; cursor:pointer;">
                            <i class="ph-bold ph-arrow-clockwise"></i> Tentar Novamente
                        </button>
                    </div>
                `;
                return;
            }

            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ph-duotone ph-package" style="font-size: 3rem; margin-bottom: 20px; color: #64748b;"></i>
                        <h3 style="color: #1e293b; margin-bottom: 10px;">Nenhum pedido encontrado</h3>
                        <p style="margin-bottom: 20px;">Você ainda não realizou nenhuma solicitação de orçamento ou compra.</p>
                        <a href="index.html#catalogo" class="btn btn-primary" style="display:inline-block; padding: 12px 30px; text-decoration:none; background: var(--accent-orange); color: white; border-radius: 8px;">Ver Produtos</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => createOrderCard(order)).join('');

            // Trigger animations after render
            setTimeout(() => {
                document.querySelectorAll('.progress-line-fill').forEach(bar => {
                    const width = bar.getAttribute('data-width');
                    bar.style.width = width;
                });
            }, 100);
        }

        function createOrderCard(order) {
            const statusInfo = OrderManager.getStatusInfo(order.status);

            // Generate Steps HTML
            const steps = [
                { id: 'pending', label: 'Análise', desc: 'Recebemos seu pedido', icon: 'ph-clipboard-text' },
                { id: 'paid', label: 'Aprovado', desc: 'Pagamento confirmado', icon: 'ph-check-circle' },
                { id: 'production', label: 'Produção', desc: 'Personalizando itens', icon: 'ph-paint-brush' },
                { id: 'shipped', label: 'Enviado', desc: 'A caminho de você', icon: 'ph-truck' },
                { id: 'delivered', label: 'Entregue', desc: 'Pedido concluído', icon: 'ph-package' }
            ];

            const currentStepIndex = steps.findIndex(s => s.id === order.status);

            // Calculate Progress Bar Width (0% to 100%)
            // 5 Steps. 
            // Step 0: 0%
            // Step 1: 25%
            // Step 2: 50%
            // Step 3: 75%
            // Step 4: 100%
            const progressPercentage = Math.max(0, Math.min(100, (currentStepIndex / (steps.length - 1)) * 100));

            const progressBarHTML = steps.map((step, index) => {
                let cssClass = '';
                if (index < currentStepIndex) cssClass = 'completed';
                if (index === currentStepIndex) cssClass = 'active';

                let iconContent = '';
                if (index < currentStepIndex) iconContent = '<i class="ph-bold ph-check"></i>';
                else iconContent = `<i class="ph-bold ${step.icon}"></i>`;

                return `
                    <div class="progress-step ${cssClass}">
                        <div class="step-circle">${iconContent}</div>
                        <div class="step-info">
                            <div class="step-label">${step.label}</div>
                            <div class="step-desc">${step.desc}</div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="order-card">
                    <div class="order-header">
                        <div>
                            <div class="order-id">PEDIDO #${order.id}</div>
                            <div class="order-date">${new Date(order.date).toLocaleDateString('pt-BR')} às ${new Date(order.date).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="font-weight:700; color:${statusInfo.color}; background:${statusInfo.color}15; padding:6px 14px; border-radius:99px; font-size:0.85rem; border: 1px solid ${statusInfo.color}30; display:inline-block;">
                                ${statusInfo.label}
                            </div>
                            <div style="font-size:1.3rem; font-weight:800; margin-top:8px; color:#1e293b;">
                                R$ ${order.total.toFixed(2)}
                            </div>
                        </div>
                    </div>

                    <div class="progress-track" style="margin-top: 50px; margin-bottom: 50px;">
                        <div class="progress-line-bg"></div>
                        <div class="progress-line-fill" data-width="${progressPercentage}%"></div>
                        ${progressBarHTML}
                    </div>

                    <div class="order-items">
                        <h4 style="margin-bottom:15px; font-size:0.95rem; color:#64748b; text-transform:uppercase; letter-spacing:0.05em;">Itens do Pedido</h4>
                        ${order.items.map(item => `
                            <div class="order-item-row">
                                <div style="display:flex; align-items:center; gap:12px;">
                                    ${item.image ? `<div style="width:40px; height:40px; background:url('${item.image}') center/cover; border-radius:8px;"></div>` : ''}
                                    <span>${item.quantity}x <strong style="color: #1e293b;">${item.name}</strong></span>
                                </div>
                                <span style="font-weight:600; color:#475569;">R$ ${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div style="margin-top: 20px; text-align: right; display: flex; justify-content: flex-end; gap: 10px;">
                         <button class="btn-order-action">
                            <i class="ph-bold ph-file-pdf"></i> Baixar PDF
                         </button>
                         <a href="https://wa.me/5531987398136?text=Olá, gostaria de saber sobre o pedido ${order.id}" target="_blank" class="btn-order-action" style="background:#25D366; color:white; border:none;">
                            <i class="ph-bold ph-whatsapp-logo"></i> Falar com Atendente
                         </a>
                    </div>
                </div>
            `;
        }
    </script>
</body>

</html>
