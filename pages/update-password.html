<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha | Marca Viva</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../styles/base/global.css">
    <link rel="stylesheet" href="../styles/components/auth.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="auth-page-bg">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Definir Nova Senha</h2>
                <p>Crie uma senha forte e segura.</p>
            </div>

            <form id="updatePasswordForm">
                <div class="form-group">
                    <label class="form-label">Nova Senha</label>
                    <div class="input-wrapper">
                        <i class="ph-regular ph-lock input-icon"></i>
                        <input type="password" id="new-password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <i class="ph-regular ph-lock input-icon"></i>
                        <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="button" class="btn btn-full" onclick="handleUpdatePassword()">Atualizar Senha</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../scripts/config/config.js"></script>
    <script src="../scripts/services/supabase-client.js"></script>
    <script>
        async function handleUpdatePassword() {
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword.length < 6) {
                return Swal.fire('Senha fraca', 'Mínimo de 6 caracteres.', 'warning');
            }
            if (newPassword !== confirmPassword) {
                return Swal.fire('Senhas não conferem', 'Verifique a digitação.', 'warning');
            }

            // Check if we have a session (hash fragment from email link)
            try {
                const { error } = await window.supabase.auth.updateUser({ password: newPassword });

                if (error) throw error;

                await Swal.fire({
                    icon: 'success',
                    title: 'Senha Atualizada!',
                    text: 'Você já pode fazer login com a nova senha.',
                    confirmButtonText: 'Ir para Login',
                    confirmButtonColor: '#1e293b'
                });
                window.location.href = 'login.html';

            } catch (err) {
                console.error(err);
                Swal.fire('Erro', 'Não foi possível atualizar a senha. O link pode ter expirado.', 'error');
            }
        }

        // Recuperação: token no hash; getSession() pode demorar — não invalidar o link cedo demais.
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabase) return;

            const { data: { session: first } } = await window.supabase.auth.getSession();
            if (first) return;

            let done = false;
            let failTimer;
            let subscription = null;

            const finish = () => {
                if (done) return;
                done = true;
                if (failTimer) clearTimeout(failTimer);
                try {
                    subscription?.unsubscribe();
                } catch (e) { /* noop */ }
            };

            const { data: { subscription: sub } } = window.supabase.auth.onAuthStateChange((event, sess) => {
                if (!sess) return;
                if (event === 'INITIAL_SESSION' || event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
                    finish();
                }
            });
            subscription = sub;

            failTimer = setTimeout(async () => {
                if (done) return;
                const { data: { session: last } } = await window.supabase.auth.getSession();
                if (last) {
                    finish();
                    return;
                }
                finish();
                await Swal.fire({
                    icon: 'warning',
                    title: 'Link inválido ou expirado',
                    html: 'Este link de recuperação pode ter expirado.<br><br>Volte para a tela de login e solicite um novo link de redefinição.',
                    confirmButtonText: 'Ir para Login',
                    confirmButtonColor: '#1e293b'
                });
                window.location.href = 'login.html';
            }, 4500);
        });
    </script>
</body>

</html>
