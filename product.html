<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalhes do produto - Marca Viva">
    <title>Detalhes do Produto | Marca Viva</title>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/shop.css">

    <style>
        /* Product Page Specific Styles */
        .product-page-container {
            padding: 120px 0 60px 0;
            min-height: 80vh;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .product-gallery {
            position: relative;
            background: #f8fafc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 1;
        }

        .product-gallery img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-gallery:hover img {
            transform: scale(1.05);
        }

        .product-info h1 {
            font-size: 2.5rem;
            color: var(--primary-hero);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .product-category {
            font-size: 0.9rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .product-price {
            font-size: 2.2rem;
            color: var(--gold-dark);
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .product-price span {
            font-size: 1rem;
            color: #94a3b8;
            font-weight: 400;
            text-decoration: none;
        }

        .product-desc-box {
            background: #f8fafc;
            padding: 24px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-orange);
            margin-bottom: 30px;
        }

        .product-desc-box p {
            color: #475569;
            line-height: 1.6;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #25D366;
            color: white;
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            border: none;
            cursor: pointer;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
            background: #22c55e;
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 30px;
            }

            .product-page-container {
                padding-top: 100px;
            }

            .product-info h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="main-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <div class="logo-icon"><i class="ph-bold ph-cube"></i></div>
                Marca Viva
            </a>

            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="index.html#catalogo">Catálogo</a>
                <a href="orders.html">Meus Pedidos</a>
                <a href="#">Contato</a>
            </nav>

            <div class="header-actions" id="user-nav">
                <!-- Auth UI injected by JS -->
            </div>
        </div>
    </header>

    <main class="product-page-container">
        <div class="container">
            <!-- Back Link -->
            <a href="index.html#catalogo"
                style="display:inline-flex; align-items:center; gap:5px; color:#64748b; margin-bottom:20px; text-decoration:none;">
                <i class="ph-bold ph-arrow-left"></i> Voltar para o Catálogo
            </a>

            <div class="product-detail-grid">
                <!-- Left: Image -->
                <div class="product-gallery">
                    <img id="product-img" src="https://via.placeholder.com/500" alt="Produto">
                    <div id="loading-spinner"
                        style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#f8fafc; z-index:10;">
                        <i class="ph-bold ph-spinner ph-spin" style="font-size:2rem; color:var(--primary-hero);"></i>
                    </div>
                </div>

                <!-- Right: Info -->
                <div class="product-info">
                    <span class="product-category" id="product-cat">Carregando...</span>
                    <h1 id="product-name">...</h1>

                    <div class="product-price">
                        <div id="product-price">R$ 0,00</div>
                        <span>/unidade</span>
                    </div>

                    <div class="product-desc-box">
                        <h4 style="margin-bottom:10px; color:var(--primary-hero);">Sobre este produto</h4>
                        <p id="product-desc">Carregando detalhes...</p>
                    </div>

                    <div style="margin-bottom: 30px;">
                        <label style="display:block; font-weight:600; color:#334155; margin-bottom:8px;">Quantidade
                            Desejada</label>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <input type="number" id="order-qty" value="20" min="10"
                                style="padding:12px; border:1px solid #cbd5e1; border-radius:8px; width:100px; font-size:1rem;">
                            <span style="font-size:0.9rem; color:#64748b;">Mínimo: 20 un</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="btn btn-outline" onclick="addToCartFromPage()"
                            style="flex: 1; min-width: 200px; padding: 18px; border-radius: 12px; font-weight: 700; border: 2px solid var(--primary-hero); color: var(--primary-hero);">
                            <i class="ph-bold ph-shopping-cart"></i> Adicionar ao Carrinho
                        </button>

                        <button class="whatsapp-btn" onclick="requestViaWhatsapp()" style="flex: 1; min-width: 200px;">
                            <i class="ph-fill ph-whatsapp-logo" style="font-size:1.5rem;"></i>
                            Pedir no WhatsApp
                        </button>
                    </div>

                    <p style="text-align:center; font-size:0.8rem; color:#94a3b8; margin-top:15px;">
                        Atendimento imediato • Proposta em PDF
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer
        style="background: #0f172a; color: #64748b; padding: 40px 0; font-size: 0.9rem; border-top: 1px solid #1e293b;">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div>© 2026 Marca Viva. Todos os direitos reservados.</div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="scripts/config.js"></script>
    <script src="scripts/services/supabase-client.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/products.js"></script>
    <script src="scripts/cart.js"></script>

    <script>
        // --- Product Page Logic ---
        let currentProduct = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // 1. Parse ID from URL
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            if (!productId) {
                alert("Produto não encontrado.");
                window.location.href = "index.html";
                return;
            }

            // 2. Fetch Product Data
            const products = await dataManager.fetchProducts(); // Ensures data is loaded
            currentProduct = products.find(p => p.id === productId);

            // 3. Render
            if (currentProduct) {
                document.getElementById('product-img').src = currentProduct.image || 'https://via.placeholder.com/500';
                document.getElementById('product-cat').innerText = currentProduct.category || 'Geral';
                document.getElementById('product-name').innerText = currentProduct.name;
                document.getElementById('product-price').innerText = `R$ ${currentProduct.price.toFixed(2)}`;
                document.getElementById('product-desc').innerText = currentProduct.description || "Produto personalizado de alta qualidade, ideal para kits corporativos e eventos.";

                document.getElementById('loading-spinner').style.display = 'none';
            } else {
                alert("Produto não encontrado no catálogo.");
                window.location.href = "index.html";
            }
        });

        function addToCartFromPage() {
            if (!currentProduct) return;
            const qty = parseInt(document.getElementById('order-qty').value) || 20; // Default min

            // Use cartService from scripts/cart.js
            if (typeof cartService !== 'undefined') {
                cartService.add(currentProduct, qty);

                // Visual Feedback
                const btn = document.querySelector('.btn-outline'); // The cart button
                const oldText = btn.innerHTML;
                btn.innerHTML = '<i class="ph-bold ph-check"></i> Adicionado!';
                setTimeout(() => btn.innerHTML = oldText, 2000);
            } else {
                console.error("CartService not loaded");
            }
        }

        async function requestViaWhatsapp() {
            if (!currentProduct) return;

            const qty = document.getElementById('order-qty').value;
            const total = (currentProduct.price * qty).toFixed(2);

            // 1. Try to Save Order silently for tracking
            if (typeof dataManager !== 'undefined') {
                try {
                    const currentUser = typeof authService !== 'undefined' ? authService.getCurrentUser() : null;
                    const customerData = {
                        name: currentUser ? currentUser.name : 'Visitante Produto',
                        email: currentUser ? currentUser.email : 'guest@produto.com'
                    };

                    await dataManager.createOrder(customerData, [{
                        id: currentProduct.id,
                        quantity: qty,
                        price: currentProduct.price
                    }], currentProduct.price * qty);
                } catch (e) { console.warn("Track order error", e); }
            }

            const message = `Olá! Tenho interesse no *${currentProduct.name}*.\n\n` +
                `📦 Quantidade: ${qty}\n` +
                `💰 Preço Unitário: R$ ${currentProduct.price.toFixed(2)}\n` +
                `🏷️ Total Estimado: R$ ${total}\n\n` +
                `Gostaria de solicitar um orçamento formal.`;

            // Format for URL
            const encoded = encodeURIComponent(message);
            const phone = "5511999999999"; // Replace with User Phone if available, or generic placeholder

            // Open WhatsApp
            window.open(`https://wa.me/${phone}?text=${encoded}`, '_blank');
        }
    </script>
</body>

</html>
